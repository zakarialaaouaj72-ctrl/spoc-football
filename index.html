<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOC Football</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>⚽ SPOC Football</h1>
<p>آخر أخبار ونتائج كرة القدم</p>
</header>

<nav>
<button onclick="showPage('matches')">المباريات</button>
<button onclick="showPage('news')">الأخبار</button>
<button onclick="showPage('standings')">الترتيب</button>
</nav>

<section id="matches" class="page active">
<h2>مباريات اليوم</h2>

<div class="card">
<h3>برشلونة × ريال مدريد</h3>
<p>22:00</p>
</div>

<div class="card">
<h3>الرجاء × الوداد</h3>
<p>20:00</p>
</div>

</section>

<section id="news" class="page">
<h2>آخر الأخبار</h2>

<div class="card">
<h3>أهلاً بك في SPOC Football</h3>
<p>سيتم إضافة الأخبار التلقائية قريباً.</p>
</div>

</section>

<section id="standings" class="page">
<h2>ترتيب الدوريات</h2>

<div class="card">
<p>سيتم إضافة الترتيب تلقائياً.</p>
</div>

</section>

<script src="script.js"></script>

</body>
</html>
